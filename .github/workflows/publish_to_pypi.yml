name: Upload new ECabc version to PyPI

# Publishes on GitHub Release using the repository secret PYPI_API_TOKEN.
# Trusted publishing (OIDC) is preferred when a maintainer can configure PyPI;
# until then this token-based path remains the supported release mechanism.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish package to PyPI
        # pypa/gh-action-pypi-publish@release/v1
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
